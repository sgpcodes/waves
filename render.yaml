# Blueprint do Render: cria o backend (Django) e o frontend (site estático)
# de uma vez. No Render: New -> Blueprint -> escolha este repositório.
# O banco NÃO fica no Render: é o Postgres do Supabase (DATABASE_URL).
services:
  - type: web
    name: ondas-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Connection string do Supabase (Session pooler, porta 5432).
      - key: DATABASE_URL
        sync: false
      # URL do frontend, ex.: https://ondas-frontend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: ondas-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # O Vite 8 precisa de Node 20.19+ — fixa a 22 pra não depender do padrão do Render.
      - key: NODE_VERSION
        value: "22"
      # URL do backend, ex.: https://ondas-backend.onrender.com
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
